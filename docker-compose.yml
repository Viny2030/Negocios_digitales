version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://prescriptive:prescriptive@db:5432/prescriptive
      - DATASETS_DIR=/app/storage/datasets
      - MODELS_DIR=/app/storage/models
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://prescriptive:prescriptive@db:5432/prescriptive
      - DATASETS_DIR=/app/storage/datasets
      - MODELS_DIR=/app/storage/models
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=prescriptive
      - POSTGRES_PASSWORD=prescriptive
      - POSTGRES_DB=prescriptive
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
