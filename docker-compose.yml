services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://prescriptive:prescriptive@db:5432/prescriptive
      - DATASETS_DIR=/app/storage/datasets
      - MODELS_DIR=/app/storage/models
    volumes:
      # Volumen con nombre: hereda los permisos de la imagen, donde la app no corre como root.
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=prescriptive
      - POSTGRES_PASSWORD=prescriptive
      - POSTGRES_DB=prescriptive
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo desde esta máquina: la contraseña de arriba es de desarrollo.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Por TCP a propósito: en el primer arranque Postgres levanta un servidor temporal
      # que solo escucha por socket, y un pg_isready sin -h daría "listo" antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U prescriptive -d prescriptive"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  storage:
