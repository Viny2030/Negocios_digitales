name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Misma versión que el Dockerfile de producción (python:3.11-slim) y que
          # pyproject.toml (target-version="py311") -- antes este workflow corría en
          # 3.12 mientras el contenedor real corre 3.11, así que código que pasaba
          # CI/lint podía usar sintaxis 3.12-only y romper recién en producción.
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias (prod + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Correr tests
        run: python -m pytest tests/ -q
