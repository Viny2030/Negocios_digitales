@'
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["fastapi", "starlette", "uvicorn*", "pydantic*", "python-multipart", "slowapi"]
      dev:
        patterns: ["pytest*", "httpx", "ruff", "pre-commit"]
    ignore:
      # Los modelos joblib dependen de estas versiones: se suben a mano, reentrenando.
      - dependency-name: "scikit-learn"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "joblib"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
'@ | Set-Content -Encoding ascii .github/dependabot.yml
