[tool.ruff]
line-length = 115
# Alineado con el Dockerfile de producción (python:3.11-slim) y el CI (.github/workflows/
# tests.yml) -- antes decía "py312" mientras el contenedor real corre 3.11, así que ruff
# podía sugerir/aceptar sintaxis que se rompe en producción.
target-version = "py311"

[tool.ruff.format]
# El repo fuerza LF en todo el código vía .gitattributes (`* text=auto eol=lf`), pero el
# default de ruff-format para el final de línea es "auto" (usa el de cada archivo, o el
# nativo del SO si es ambiguo) -- en Windows eso hizo que `ruff format`/el hook de
# pre-commit reescribiera algunos archivos con CRLF, entrando en conflicto con
# .gitattributes y con el resultado de correr el mismo hook en Linux/Mac/CI, y
# generando un ciclo de "el hook sigue modificando archivos" en cada commit. Fijarlo acá
# saca la ambigüedad: ruff siempre emite LF, sin importar el SO donde corra.
line-ending = "lf"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle básicos, I = orden de imports (isort), UP = sintaxis moderna,
# B = bugbear (patrones propensos a bugs, ej. mutable default arguments).
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # largo de línea: ya lo controla line-length + hay strings largos en docstrings
    "B008",  # Depends(...)/File(...) como default es el patrón idiomático de FastAPI
    "B905",  # zip() sin strict=: no vale la pena tocar los 3 usos existentes en este pase
    "UP042", # class Foo(str, enum.Enum) -> StrEnum: cambia sutilmente la serialización: se deja como está
]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "database", "security", "model_registry", "rate_limit"]
